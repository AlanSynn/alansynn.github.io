name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1: the sitemap-lastmod
          # integration (astro.config.mjs) derives each URL's <lastmod> from
          # its source file's last commit. A shallow checkout can't answer
          # per-file `git log`, which would silently strip every lastmod.
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build (Astro + Pagefind)
        run: bun run build

      - name: Install Playwright (chromium)
        run: bunx playwright install --with-deps chromium

      # CSS-isolation guard: the academic /projects/<slug> route split is
      # load-bearing (keeps site base.css out of the microsite). Asserts no site
      # stylesheet leaks into it, in light + dark, on the built site.
      - name: CSS-isolation guard
        run: |
          bun run preview &
          SERVER_PID=$!
          for i in $(seq 1 40); do curl -sSf http://localhost:4321/ >/dev/null 2>&1 && break || sleep 0.5; done
          node scripts/check-isolation.mjs
          kill $SERVER_PID 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Ask the IndexNow engines (Bing, Yandex, Naver, Seznam, Yep: Google is not
  # a participant and needs nothing) to fetch changed pages right after deploy.
  # Simplest correct shape at ~15 URLs: read the JUST-DEPLOYED sitemap off the
  # live site and submit every URL: under every quota, no path→URL mapping,
  # misses nothing (research agents' consensus, 2026-10). The key is not a
  # secret (it is served publicly at /<key>.txt for ownership verification);
  # the key FILE is committed so engines can validate it. Failure to ping must
  # never fail a finished deploy → continue-on-error.
  ping-indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: |
          KEY='87642b6e732c32916636de79ab984619'
          URLS=$(curl -fsS --retry 3 https://alansynn.com/sitemap-0.xml \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's/<loc>/"/' -e 's#</loc>#"#' \
            | paste -sd, -)
          [ -n "$URLS" ] || { echo "no URLs parsed from sitemap"; exit 1; }
          curl -fsS --retry 2 -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"alansynn.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://alansynn.com/$KEY.txt\",\"urlList\":[$URLS]}"
          echo "IndexNow accepted: [$URLS]"
