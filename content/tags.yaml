# ============================================================================
# Blog tag registry. Every `tags:` value on a post (content/blog/*.typ
# frontmatter) must appear in this list, or the build fails with a located
# Zod error (src/content.config.ts → z.enum over these keys).
#
# Design:
#   - GENERAL-blog register: broad conventional buckets, simple noun slugs a
#     stranger reads correctly in 3 seconds. No near-synonym pairs (one
#     `research` bucket, not research-cultures + academia) and no compound
#     slugs (career, not career-and-learning).
#   - Topic-only axis. One SUBJECT per tag — no format tags (essay /
#     reflection / research-as-format), which are non-selective on a personal
#     blog and only smear the filter bar. A format tag is allowed only if it
#     stays selective (a small minority of posts), e.g. a future `tutorial`
#     (register it the day the first tutorial ships — never in advance).
#   - `ai` means AI is the SUBJECT of the post, never backdrop. If the post
#     survives intact with AI swapped for any other fast technology, it does
#     not get this tag.
#   - Up to 3 tags per post (enforced by `.max(3)` in the schema): the first
#     tag is the post's home subject; each additional tag only when the post
#     is genuinely intersectional. Singleton chips are normal on a young blog.
#   - Validation-only — this list is NOT the display source. The chip text is
#     title-cased from the slug in the component, so keep entries as bare
#     kebab-case slugs. Add a tag here first, then use it on a post.
#
# Buckets in use:
#   research     — research as the subject: epistemology, cultures, settings,
#                  profession (the blog's home bucket)
#   ai           — AI itself under discussion (currently 1 post; deliberate
#                  forward-registration)
#   career       — professional path-making: choosing, preparing for, and
#                  living a working life
#   education    — what education and learning are for
#   design       — design traditions and what they teach
#   typst, meta  — site/writing mechanics (draft usage guide only)
# ============================================================================
- research
- ai
- career
- education
- design
- typst
- meta
