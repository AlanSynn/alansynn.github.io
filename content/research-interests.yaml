statements:
  - >-
    I study **motion** as a computational medium in computer graphics and
    human–computer interaction (HCI). I build interactive systems for
    designing, generating, and fabricating motion, connecting expressive intent
    with computational design and physical realization. My research interests
    include computer animation, computational design, motion synthesis, and
    AI-assisted creative tools. My earlier work spans machine-learning systems,
    cloud software, games, and social robots.

focus_areas:
