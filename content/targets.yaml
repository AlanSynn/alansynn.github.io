# ============================================================================
# Targeted resume/CV variants. Each id becomes `just resume <id>` / `just cv <id>`
# (e.g. `just resume graphics`). The web is the default/untargeted view and
# ignores this file.
#   blurb    = research statement swapped into this target's PDF. The DEFAULT
#              blurb lives in research-interests.yaml (used by web + default CV).
#   keywords = substring match against each paper's title + venue + abbr
#              (lowercased). Matched pubs sort to the TOP of the CV and are the
#              ONLY pubs on the resume.
# Adding a target here is the only step; resume/typst/lib.typ picks it up
# automatically (no code edit). Validated at build by targetsSchema
# (src/lib/content-schema.ts), so a typo fails loudly.
# ============================================================================

graphics:
  blurb: >-
    My research builds interactive systems for authoring and controlling
    motion at the boundary of computer graphics and HCI. My CHI 2026 system
    MotionSmith connects motion sketching, generated mechanisms, and
    fabrication-ready export, developed through a year-long participatory
    design process with expert automata makers. My current question: how can
    a creator make local motion edits while preserving accepted timing,
    contacts, and unaffected behavior?
  keywords:
    - motion
    - automata
    - kinematic
    - sketch
    - graphics
    - animation
    - tangible
    - makecode
    - creativity
    - design

ml-systems:
  # NOTE: "system" / "cloud" are intentionally omitted: the substring match
  # caught "Design System" (MotionSmith title), "Computing Systems" (CHI venue
  # boilerplate → Tangible), and "Point Cloud" (FBS title), pulling graphics
  # papers to the TOP of the ml-systems resume. Every legit ML-systems paper
  # here has a stronger keyword, so the two ambiguous ones are dropped.
  blurb: >-
    My research builds low-latency systems for interactive media and ML
    workloads: a time-series multimodal datastore for low-latency media
    analytics (Dolby), a privacy-preserving deep-learning inference framework
    (Protopia AI), and first-author published work on data-loading and
    distributed-training efficiency. I study how such systems make iterative
    interaction with computational models faster, cheaper, and reproducible.
  keywords:
    - training
    - dataloader
    - batch
    - distributed
    - streaming
    - privacy
    - inference
    - kubernetes
