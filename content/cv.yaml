# Selected Research Projects (CV-only, academiccv.cls port). The printable
# digest of the two feature projects; the web surfaces research projects as
# /projects/<slug> pages instead. `location` renders as the cls's italic
# "role or description" line under the bold title row.
projects:
  - period: 'CHI 2026'
    title: 'MotionSmith'
    location: 'Sketch-based design of mechanical motion and fabricable artifacts'
    body: |
      - Developed a computational design system that connects sketched motion paths, mechanism generation, interactive refinement, and fabrication-ready output.
      - Developed through a year-long participatory design process with three expert automata makers; supported motion exploration and the fabrication of working mechanical artifacts.
      - Publication C1; [project page](https://alansynn.com/projects/motionsmith) and [source code](https://github.com/AlanSynn/automataii).

  - period: 'Manuscript'
    title: 'MotionSmith for Young Makers'
    location: 'Educator co-design and classroom enactment of a mechanical CAD system'
    body: |
      - Extended the research to classroom use through co-design with four K-8 STEM educators, revising the authoring workflow, reusable fabrication kit, and instructional supports.
      - Used in educator-led classroom activities with 129 middle-school students at two U.S. schools; three educators facilitated STEM, STEAM, and engineering activities over three to four sessions per class.
      - Manuscript M1.

